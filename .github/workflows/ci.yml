name: CI Pipeline

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v.*.*.*"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        # uv downloads the requested interpreter, so no setup-python is needed
        python-version: ["3.11", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install nox and nox-uv
        run: uv tool install nox --with nox-uv
      - name: Run tests
        run: nox -s "tests-${{ matrix.python-version }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install nox and nox-uv
        run: uv tool install nox --with nox-uv
      - name: Run lint
        run: nox -s lint

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install nox and nox-uv
        run: uv tool install nox --with nox-uv
      - name: Run coverage
        run: nox -s coverage
      - name: Upload results to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
